<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>
  
  <!-- 引入 Google 字型 (Inter & Noto Sans TC)，提升極簡風格質感 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. 全局樣式與變數設定 (CSS Variables)
       在這裡可以輕鬆修改全站的視覺顏色與主題風格
       ========================================================================== */
    :root {
      /* 【顏色控制區】 */
      --bg-color: #f8f9fa;             /* 全局背景色 (極簡淺灰) */
      --card-bg: #ffffff;              /* 卡片背景色 */
      --primary-text: #2b2d42;         /* 主要文字顏色 */
      --secondary-text: #8d99ae;       /* 次要文字顏色 (如時間戳記) */
      --accent-color: #4a4e69;         /* 強調色/頭像背景 */
      
      /* 【輪播高亮特效設定】 */
      --highlight-border: #6c5ce7;      /* 高亮卡片的邊框顏色 (柔和紫) */
      --highlight-shadow: rgba(108, 92, 231, 0.25); /* 高亮發光陰影顏色 */
      
      /* 【動態卡片變暗/模糊設定】 */
      --dim-opacity: 0.4;              /* 未選中卡片的透明度 (0~1) */
      --dim-blur: 1.5px;               /* 未選中卡片的模糊程度 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-text);
      line-height: 1.6;
      padding: 40px 20px;
      min-height: 100vh;
    }

    /* 頁面標題區 */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    header p {
      color: var(--secondary-text);
      font-size: 0.95rem;
    }

    /* ==========================================================================
       2. 讀取中酷炫動畫 (Loading Animation)
       ========================================================================== */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
    }

    /* 光環旋轉動畫 */
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 0, 0, 0.05);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.95rem;
      color: var(--secondary-text);
      letter-spacing: 2px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ==========================================================================
       3. 瀑布流排版牆 (Masonry Layout)
       ========================================================================== */
    .masonry-wall {
      max-width: 1200px;
      margin: 0 auto;
      
      /* RWD 欄位數量控制 (欄位間距由 column-gap 決定) */
      column-count: 3; 
      column-gap: 24px;
    }

    /* 響應式斷點調整：螢幕變小時自動減少欄位 */
    @media (max-width: 900px) {
      .masonry-wall { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-wall { column-count: 1; }
    }

    /* ==========================================================================
       4. 留言卡片基礎與動態特效 (Message Cards & Transitions)
       ========================================================================== */
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.04);
      
      /* 關鍵：防止瀑布流卡片被截斷 */
      break-inside: avoid;
      
      /* 平滑渡特效設定 */
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
      transform-origin: center center;
    }

    /* 頭像與作者資訊 */
    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--accent-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .author-info .name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .author-info .time {
      font-size: 0.75rem;
      color: var(--secondary-text);
    }

    .card-content {
      font-size: 0.95rem;
      color: var(--primary-text);
      white-space: pre-wrap; /* 保留留言中的換行符號 */
      word-break: break-word;
    }

    /* --------------------------------------------------------------------------
       5. 輪播播放狀態 CSS (Focus & Dim States)
       -------------------------------------------------------------------------- */
    /* 被選中的卡片：放大、亮起、發光 */
    .card.is-highlighted {
      transform: scale(1.05);
      border-color: var(--highlight-border);
      box-shadow: 0 10px 30px var(--highlight-shadow);
      z-index: 10; /* 確保放大的卡片不會被相鄰卡片遮擋 */
      opacity: 1 !important;
      filter: blur(0px) !important;
    }

    /* 輪播開啟時，未被選中的卡片：變暗、微模糊 */
    .masonry-wall.is-active .card:not(.is-highlighted) {
      opacity: var(--dim-opacity);
      filter: blur(var(--dim-blur));
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <h1>MESSAGES</h1>
    <p>朋友留給我的悄悄話留言牆</p>
  </header>

  <!-- 1. 載入中動畫區塊 -->
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 2. 留言瀑布流牆區塊 -->
  <div id="wall" class="masonry-wall"></div>

  <script>
    /* ==========================================================================
       【參數控制區】 方便你直接在這裡調整數值
       ========================================================================== */
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSfZiWU1YGGdOCG5ASlB2sPDrxloK5nbXcPYEHeL7DhGEr1UE4x4SUGoj7bhtkshtO9PwTAa5CbmwdL/pub?output=csv';
    
    // 關鍵設定：卡片輪播切換的秒數 (單位：毫秒，3000ms = 3 秒)
    const CAROUSEL_INTERVAL = 3000; 

    // 全局變數
    let cardElements = [];
    let currentIndex = 0;
    let carouselTimer = null;

    /* ==========================================================================
       CSV 解析器 (可正確處理包含雙引號與逗號的留言內容)
       ========================================================================== */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let currentVal = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            currentVal += '"';
            i++; // 跳過下一個轉義雙引號
          } else {
            inQuotes = !inQuotes; // 切換引號狀態
          }
        } else if (char === ',' && !inQuotes) {
          row.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(currentVal.trim());
          if (row.some(field => field !== '')) lines.push(row);
          row = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      if (currentVal || row.length > 0) {
        row.push(currentVal.trim());
        if (row.some(field => field !== '')) lines.push(row);
      }
      return lines;
    }

    /* ==========================================================================
       動態卡片 DOM 生成
       ========================================================================== */
    function createCardElement(item) {
      const card = document.createElement('div');
      card.className = 'card';

      // 提取名字的第一個字做為預設大頭貼
      const firstChar = item.name ? item.name.charAt(0).toUpperCase() : '?';

      card.innerHTML = `
        <div class="card-header">
          <div class="avatar">${firstChar}</div>
          <div class="author-info">
            <div class="name">${escapeHTML(item.name || '匿名朋友')}</div>
            <div class="time">${escapeHTML(item.timestamp || '')}</div>
          </div>
        </div>
        <div class="card-content">${escapeHTML(item.message || '')}</div>
      `;
      return card;
    }

    // 防止 XSS 攻擊的字串安全轉換
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    /* ==========================================================================
       重點：輪播 Highlight 動效控制 logic
       ========================================================================== */
    function startCarousel() {
      if (cardElements.length === 0) return;

      const wall = document.getElementById('wall');
      wall.classList.add('is-active'); // 啟用牆面的輪播暗化效果

      // 觸發單次卡片高亮切換
      function highlightNextCard() {
        // 1. 移除上一張卡片的高亮狀態
        cardElements.forEach(card => card.classList.remove('is-highlighted'));

        // 2. 設定當前卡片高亮
        const currentCard = cardElements[currentIndex];
        currentCard.classList.add('is-highlighted');

        // (可選) 讓視覺焦點適度捲動聚焦至該卡片區塊
        // currentCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

        // 3. 計算下一次要輪播的卡片索引 (循環播放)
        currentIndex = (currentIndex + 1) % cardElements.length;
      }

      // 立即執行第一次高亮
      highlightNextCard();

      // 設定定時器，按照設定的秒數持續輪播
      carouselTimer = setInterval(highlightNextCard, CAROUSEL_INTERVAL);
    }

    /* ==========================================================================
       主程式：Fetch 抓取 Google 試算表資料
       ========================================================================== */
    async function fetchMessages() {
      const loadingEl = document.getElementById('loading-container');
      const wallEl = document.getElementById('wall');

      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路請求失敗');
        
        const csvText = await response.text();
        const parsedRows = parseCSV(csvText);

        // 剔除 CSV 表頭 (第一列：時間戳記, 名字, 悄悄話)
        const dataRows = parsedRows.slice(1);

        // 轉換為物件陣列架構
        const messages = dataRows.map(row => ({
          timestamp: row[0] || '',
          name: row[1] || '匿名',
          message: row[2] || ''
        })).filter(item => item.message !== ''); // 過濾空訊息

        // 隱藏載入中動畫
        loadingEl.style.display = 'none';

        // 動態生成 HTML 並放入牆上
        messages.forEach(item => {
          const card = createCardElement(item);
          wallEl.appendChild(card);
          cardElements.push(card);
        });

        // 啟動 3 秒輪播特效
        startCarousel();

      } catch (error) {
        console.error('抓取留言資料時發生錯誤:', error);
        loadingEl.innerHTML = `
          <div style="color: #e63946; font-size: 0.95rem;">
            讀取留言失敗，請確認 Google 試算表發布網址權限是否正確。
          </div>
        `;
      }
    }

    // 網頁 DOM 載入完成後開始執行
    document.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
